# Production compose — use standalone, not merged with docker-compose.yml.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites on the server:
#   - .env file with production values (copy from .env.example)
#   - SSL certificates at /etc/letsencrypt/live/<domain>/
#   - docker/nginx/production.conf with correct server_name

services:
  app:
    build:
      context: .
      target: production
      args:
        UID: 1000
        GID: 1000
    env_file: .env
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - app_storage:/var/www/html/storage
    networks:
      - portfolio
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - portfolio
    restart: unless-stopped
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:alpine
    networks:
      - portfolio
    restart: unless-stopped

networks:
  portfolio:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
