# Production compose — use standalone, not merged with docker-compose.yml.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites on the server:
#   - .env file with production values (copy from .env.example)
#   - SSL certificates at /etc/letsencrypt/live/<domain>/
#   - docker/nginx/production.conf with correct server_name

services:
  app:
    build:
      context: .
      target: production
      args:
        UID: 1000
        GID: 1000
    env_file: .env
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - app_storage:/var/www/html/storage
    networks:
      - backend
      - frontend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(0);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - frontend
    restart: unless-stopped
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.5'

  mysql:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
